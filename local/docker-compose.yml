services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis yalnızca anlık fan-out taşır; kalıcı veri yok.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@db:5432/${POSTGRES_DB:-radar}
      REDIS_URL: redis://redis:6379
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_KEY: ${NTFY_KEY:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      NTFY_RECONNECT_MS: ${NTFY_RECONNECT_MS:-5000}
      TIKTOOL_API_KEY: ${TIKTOOL_API_KEY:-}
      TIKTOOL_ROOMS: ${TIKTOOL_ROOMS:-}
      TIKTOOL_MAX_ROOMS: ${TIKTOOL_MAX_ROOMS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped

  collector:
    build: ./collector
    environment:
      RADAR_API_URL: http://api:3001
      SCANNER_DATA_DIR: /scanner-data
      STATE_FILE: /state/state.json
      POLL_MS: 5000
      MAX_AGE_MS: 900000
    volumes:
      - ../site/firsat/data:/scanner-data:ro
      - collector-state:/state
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  pgdata:
  collector-state:
