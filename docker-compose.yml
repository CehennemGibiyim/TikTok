# TikTok Radar — tek servis kurulumu
#
# Panel, REST API ve WebSocket aynı Node sürecinde ve aynı origin'de çalışır.
#   docker compose up -d --build        -> http://SUNUCU_IP:3000
#   docker compose --profile https up -d -> alan adı varsa otomatik HTTPS (Caddy)
#
# .env dosyası (repoya girmez):
#   PANEL_PASSWORD=uzun-bir-anahtar
#   PANEL_ORIGINS=https://cehennemgibiyim.github.io
#   DOMAIN=panel.ornek.com

services:
  panel:
    build: ./Tiktok
    container_name: tiktok-radar
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      PANEL_ORIGINS: ${PANEL_ORIGINS:-https://cehennemgibiyim.github.io}
      RADAR_MAX_TARGETS: ${RADAR_MAX_TARGETS:-40}
      RADAR_LETTER_TTL: ${RADAR_LETTER_TTL:-180}
    volumes:
      # Hesaplar, ajanslar, hedefler ve jeton geçmişi burada kalır.
      - ./Tiktok/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Alan adı varsa HTTPS sonlandırması. Yoksa bu servis başlatılmaz.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    container_name: tiktok-radar-https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel

volumes:
  caddy_data:
  caddy_config:
