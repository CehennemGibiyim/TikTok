# Render.com — tek servis (panel + API + WebSocket aynı origin)
# Ücretsiz planda servis boşta kalınca uyur; 7/24 radar için ücretli plan veya VPS.
services:
  - type: web
    name: tiktok-radar
    runtime: node
    plan: free
    rootDir: Tiktok
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      # Panel anahtarı: Render panelinden elle girilir, repoya yazılmaz.
      - key: PANEL_PASSWORD
        sync: false
      - key: PANEL_ORIGINS
        value: https://cehennemgibiyim.github.io
      - key: RADAR_LETTER_TTL
        value: "180"
