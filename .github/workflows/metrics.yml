name: 📊 Ölçüm Raporu

# scripts/quota-report.mjs'yi tam git geçmişiyle çalıştırır ve panelin Ölçüm
# sekmesinin okuduğu site/firsat/data/metrics.json dosyasını commit eder.
# Sayılar burada üretilir, panel yalnızca gösterir.

on:
  schedule:
    # Tarama saatlik bütçeyle yavaşladığı için saatte bir yeterli.
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-report
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          # Rapor live.json/boxes.json geçmişini okuyor: sığ klonda çalışmaz.
          fetch-depth: 0

      - name: 🟢 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ⚙️ Git kimliği
        run: |
          git config user.name "olcum-raporu"
          git config user.email "actions@users.noreply.github.com"

      - name: 📊 Ölçümü üret
        run: node scripts/quota-report.mjs --json=site/firsat/data/metrics.json

      - name: 💾 Değiştiyse commit
        run: |
          git add site/firsat/data/metrics.json
          if git diff --cached --quiet; then
            echo "Ölçüm değişmedi, commit yok."
            exit 0
          fi
          git commit -m "Ölçüm verisi: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Tarayıcı aynı anda veri commit'i atabilir: reddedilirse rebase + tekrar.
          if git push --quiet; then exit 0; fi
          git pull --rebase --autostash --quiet
          git push --quiet
