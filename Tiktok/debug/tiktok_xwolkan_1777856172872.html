iriş bilgilerinizi girmeniz gerekecek.","Web_removeAccount_btn":"Kaldır","grid":"Izgara","Share":"Paylaş","feed":"Akış","custom":"Özel","website":"Web sitesini ziyaret edin","pm_mt_sublive_preview_end_title_perks":"İzlemeye devam etmek ve CANLI Yayın içerik üreticisinin ek ayrıcalıklarından yararlanmak için abone olun","pm_my_sublive_preview_end_btn":"Abone ol","live_beginning_title":"LIVE kısa süre içinde başlayacak","eventticket_openapp_desc":"Bilet almak ve bunu CANLI izlemek için uygulamayı açın","Webapp_tooltips_play":"oynat","pm_web_fullpage_error_button":"Tekrar dene","pm_mt_video_auto_toast1":"Otomatik modda, video kaliteniz internet hızınızla eşleşmek için otomatik olarak ayarlanacaktır.","Definition_select_reminder":"Şu anda {definition} içinde görüntüleniyor","Webapp_tooltips_Orientation":"Oryantasyon","pm_mt_abm_viewerside_title":"Yayıncı hakkında","pm_mt_perks_disclaimer_title":"Yalnızca yayıncı tarafından yazılır ve uygulanır.","ls_subs_goal54":"Hedefe ulaşıldı","ls_subs_goal53":"Abonelik hedefi","sub_new_user_FAQ_question_1":"Abonelik nedir?","sub_new_user_FAQ_answer_1_1":"Abonelik, içerik üreticilerinin topluluklarının bir parçası olarak onlarla daha iyi etkileşim kurmak üzere belirli avantajların keyfini çıkarabilmenizi sağlar. Topluluk ayrıcalıkları arasında şunlar bulunur:","sub_new_user_FAQ_answer_1_1_1":"İçerik üreticileriyle etkileşimde kullanabileceğiniz çıkartmalar.","sub_new_user_FAQ_answer_1_1_2":"Abonelik süresine göre seviyesi artan özel bir rozet. Rozet, CANLI Yayınlarda diğer izleyicilere gösterilir.","sub_new_user_FAQ_answer_1_1_3":"CANLI Yayın sırasında yalnızca abonelerin içerik üreticilerine göndermek için kullanabileceği Özel Hediyeler.","sub_new_user_FAQ_answer_1_1_4":"İçerik üreticisi tarafından açıldığında yalnızca abonelerin CANLI Yayınlarına yorum yapabilmelerini sağlayan abonelere özel sohbet modu.","sub_new_user_FAQ_answer_1_1_5":"Abonelerin içerik üreticisinin yorum dizilerini görüntüleyebileceği ve bunlarla etkileşim kurabileceği abonelere özel alan.","sub_new_user_FAQ_answer_1_1_6":"İçerik üreticisinin kişiselleştirilmiş hususlarını içeren diğer avantajlar.","sub_new_user_FAQ_answer_1_2":"İçerik üreticileri tarafından yapılan açıklamaların veya verilen diğer sözlerin, TikTok tarafından sağlanan abonelik hizmetlerinin bir parçasını oluşturmadığını lütfen unutmayın. Abonelik yoluyla üçüncü taraf bir platforma erişim sağlayabiliyorsanız TikTok'un bu üçüncü taraf platform tarafından sağlanan hizmetlerden sorumlu olmadığını kabul edersiniz.","sub_new_user_FAQ_question_2":"Hangi abonelik seçeneklerine sahibim?","sub_new_user_FAQ_answer_2":"Size aşağıdaki gibi bir ya da daha fazla türde abonelik seçeneği sunabiliriz:","sub_new_user_FAQ_answer_2_1":"Tek seferlik abonelik: Abonelik dönemi, abonelik tarihinden itibaren 30 takvim günü sürer.","sub_new_user_FAQ_answer_2_2":"Aylık otomatik yenilenen abonelik: Abonelik süresi, abonelik tarihinden itibaren bir takvim ayı sürer ve siz aboneliği iptal edene kadar sonraki aylık dönemlerde otomatik olarak yenilenir.","sub_new_user_FAQ_question_3":"Aboneliklerimi nereden kontrol edebilirim?","sub_new_user_FAQ_answer_3":"Aboneliklerinizi [Ayarlar ve gizlilik] \u003E [CANLI Yayın] \u003E [Abonelikler] adımından kontrol edebilirsiniz.","sub_new_user_FAQ_question_4":"Otomatik yenilenen aboneliği nasıl iptal edebilirim?","sub_new_user_FAQ_answer_4_1":"Otomatik yenilenen aboneliği dilediğiniz zaman iptal edebilirsiniz.","sub_new_user_FAQ_answer_4_2":"Topluluk avantajlarına uygulama mağazaları aracılığıyla abone olursanız iOS için App Store'daki veya Android için Google Play Store'daki ilgili ekrandan aboneliklerinizi yönetebilirsiniz.","sub_new_user_FAQ_answer_4_3":"Topluluk avantajlarına TikTok web sitesi aracılığıyla abone olursanız otomatik yenilenen aboneliği uygulamada [Ayarlar ve Gizlilik] \u003E [Abonelik] bölümüne giderek iptal edebilirsiniz. İçerik üreticisinin topluluğunu seçin ve aboneliği iptal edin. TikTok web sitesinde yapılan abonelikler \"web uygulaması aboneliği\" şeklinde işaretlenir.","sub_new_user_FAQ_answer_4_4":"Aboneliği iptal ettikten sonra topluluk avantajlarınız, bir sonraki abonelik döneminin başlangıcına kadar sona ermez. Geçerli abonelik döneminizin kalan günleri için geri ödeme veya kredi almazsınız.","sub_new_user_FAQ_EU_question_5":"Nasıl iade talep edebilirim?","sub_new_user_FAQ_EU_answer_5_1":"AEA\u002FBirleşik Krallık bölgelerinde yaşıyorsanız:","sub_new_user_FAQ_EU_answer_5_2":"İçerik üreticisinin topluluğuna uygulama mağazaları aracılığıyla abone olduğunuzda, uygulama mağazaları aracılığıyla iade talep etmeniz gerekir.","sub_new_user_FAQ_EU_answer_5_3":"İçerik üreticisinin topluluğuna TikTok web sitesi aracılığıyla abone olduğunuzda, satın alma işleminin gerçekleştirildiği başlangıç tarihinden itibaren 14 gün içinde iade talebinde bulunabilirsiniz. Yardım için lütfen [buraya] tıklayın.","sub_new_user_FAQ_question_6":"Aboneliğimi iptal edersem mevcut rozet seviyesini koruyabilir miyim?","sub_new_user_FAQ_answer_6":"Hayır, bir içerik üreticisinin topluluğuna aboneliğinizi iptal ederseniz rozet seviyeniz sıfırlanır.","sub_new_user_FAQ_question_7":"Başka sorunlar mı var?","sub_new_user_FAQ_answer_7_1":"Daha fazla bilgi için [Abonelik Koşulları] bölümünü ziyaret edebilirsiniz.","sub_new_user_FAQ_answer_7_2":"Abonelikleriniz kapsamındaki herhangi bir avantaj eksikse, kullanılamıyorsa veya belirtildiği gibi çalışmıyorsa yardım için [bizimle iletişime geçebilirsiniz]. Ek destek için [Apple destek] veya [Google Play] Yardım ile iletişime geçebilirsiniz.","subfest_livePage_subDetail_price_activityLabel":"Abonelik Festivali teklifi","pm_mt_monsub_title":"{host} adlı yayıncıya 1 aylık abonelik","pm_mt_autosub_title":"{host} adlı yayıncıya aylık otomatik yenilenen abonelik","pm_mt_sub_seclect_title":"Planınızı seçin","pm_mt_sub_seclect_mon":"1 aylık abonelik","subfest_livePage_subDetail_price_autoRenewOption":"Aylık yenileme","pm_mt_sub_seclect_auto":"Aylık otomatik yenilenen abonelik","pm_mt_su erine karşı dostane bir şekilde rekabet etmelerini sağlayan bir özelliktir.","pm_mt_matchNewFaq_topic1_1_2":"İzleyiciler, Hediye göndererek veya CANLI Yayını beğenerek favori içerik üreticilerini destekleyebilir. Her izleyici, birden fazla Hediye ve maç başına 1 beğeni gönderebilir. CANLI Yayın içerik üreticileri, CANLI Yayının aldığı Hediyelere ve beğenilere dayalı olarak maç puanı toplar. 1 Jeton, 1 maç puanı; 1 beğeni ise 3 maç puanı anlamına gelir.","pm_mt_matchNewFaq_topic1_1_3":"CANLI Yayın maçının kazananı, CANLI Yayın maçı sırasında en yüksek maç puanını toplayan CANLI Yayın içerik üreticisi veya ekibi olur.","pm_mt_matchNewFaq_topic1_2":"2. Özel hediye maçı nedir ve işleyişi nasıldır?","pm_mt_matchNewFaq_topic1_2_1":"CANLI Yayın içerik üreticileri, başka bir CANLI Yayın içerik üreticisine maç daveti göndermeden önce belirli bir Hediye seçerek hediyeye özel bir maç başlatabilir.","pm_mt_matchNewFaq_topic1_2_2":"Hediyeye özel bir maçta kazanan, izleyicilerin söz konusu Hediyeden kaç tane gönderdiğine göre belirlenir. İzleyiciler, desteklerini göstermek üzere başka Hediyeler veya CANLI Yayın için beğeni gönderebilir ama sadece seçilen Hediye hesaba katılır.","pm_mt_matchNewFaq_topic1_2_3":"Söz konusu Hediyeler, Hediye Kutularında bulunmalarına veya bağımsız olarak gönderilmiş olmalarına bakılmaksızın hesaba katılır.","pm_mt_match_faq_topic_2":"Maça katkıda bulunanlar","pm_mt_matchNewFaq_topic2_1":"1. CANLI Yayın maçına katkıda bulunanlar kimlerdir?","pm_mt_matchNewFaq_topic2_1_1":"Maça katkıda bulunanlar, tüm hediyeleri içeren maçlar sırasında CANLI Yayını beğenen veya CANLI Yayın maçı sırasında içeriğe takdirlerini göstermek için Hediyeler gönderen izleyicilerdir.","pm_mt_matchNewFaq_topic2_1_2":"Hediyeye özel maçlar sırasında, CANLI Yayın maçı devam ederken içeriği takdir etmek üzere CANLI Yayın içerik üreticisi tarafından seçilen belirli Hediyeyi gönderen izleyiciler maça katkıda bulunur.","pm_mt_matchNewFaq_topic2_2":"2. En çok katkıda bulunanlar kimlerdir?","pm_mt_matchNewFaq_topic2_2_1":"Bir CANLI Yayın maçı sırasında hem CANLI Yayın içerik üreticileri hem de ekipler için maç puanına en fazla katkıda bulunan ilk 3 izleyici, zafer turu sırasında belirlenir. Kazanan CANLI Yayın içerik üreticisine veya ekibe en fazla maç puanıyla katkıda bulunan izleyici, MVP (en değerli oyuncu) olur.","pm_mt_matchNewFaq_topic2_2_2":"CANLI Yayın maçı berabere biterse zafer turu olmaz veya en çok katkıda bulunanlar belirlenmez.","pm_mt_matchNewFaq_topic2_2_3":"Katkıda bulunanlar her CANLI Yayın maçının sonunda sıfırlanır, böylece herkes bir sonraki turda yer alma şansına sahip olur.","pm_mt_match_faq_topic_3":"Maç takviyeleri","pm_mt_matchNewFaq_topic3_1":"1. Maç takviyeleri nelerdir?","pm_mt_matchNewFaq_topic3_1_1_team":"Maç takviyeleri, izleyicilerin favori CANLI Yayın içerik üreticilerini veya ekiplerini bir CANLI Yayın maçı kazanmalarını sağlamak üzere daha iyi bir şekilde desteklemek için kullanabilecekleri araçlardır. Maç takviyeleri, bir CANLI Yayın maçı sırasında kazanan CANLI Yayın içerik üreticisine veya ekibe en çok katkıda bulunan 3 izleyiciye rastgele dağıtılır.","pm_mt_matchNewFaq_topic3_1_2_includeEffect":"Maç güçlendirmeleri şu anda güçlendirme eldivenlerini, sihirli sisleri, ek süreleri ve sersemletici çekiçleri içermektedir.","pm_mt_matchNewFaq_topic4_1_3":"[Hediye puanı hedefi]: Belirli bir sayıda hediye puanı kazanmak","pm_mt_matchNewFaq_topic4_1_4":"Hedefe ulaşan CANLI Yayın içerik üreticileri veya ekip, 30 ila 60 saniye boyunca iki veya üç kat hediye puanı alacaktır.","pm_mt_matchNewFaq_topic3_1_3":"Güçlendirme eldiveni","pm_mt_matchNewFaq_topic3_1_4":"Güçlendirme eldiveni, Hediyeler aracılığıyla katkıda bulunulabilen maç puanını katlayabilir ve etkisi 30 saniye sürer.","pm_mt_matchNewFaq_topic3_1_5":"Güçlendirme eldiveni, bir CANLI Yayın maçı sırasında etkili olduğunda, gönderilen Hediyelerin 5 kat maç puanı kazandırma şansı %30'a kadar çıkar.","pm_mt_matchNewFaq_topic3_1_6":"Bir CANLI Yayın maçı sırasında birden fazla güçlendirme eldiveni gönderilirse bunlar gönderilme sırasına göre etkili olur. Çarpanlar birikmez. Bu aynı zamanda hız meydan okumaları için de geçerlidir.","pm_mt_matchNewFaq_topic3_1_7":"Hediyeye özel maçlar sırasında, güçlendirme eldivenleri yalnızca belirli Hediyeler üzerinde etkilidir.","pm_mt_matchNewFaq_topic3_1_team_boost":"Ekip maçları sırasında gönderilen güçlendirme eldivenleri, CANLI Yayın içerik üreticisinin ekip arkadaşlarına da uygulanır.","pm_mt_matchNewFaq_topic3_1_8":"Sihirli sis","pm_mt_matchNewFaq_topic3_1_9":"Sihirli sis, CANLI Yayın içerik üreticisinin maç puanının rakip CANLI Yayın içerik üreticileri ve bu içerik üreticilerinin izleyicileri tarafından görülememesine neden olabilir. Etkisi 30 saniye sürer.","pm_mt_matchNewFaq_topic3_1_10":"Birden fazla sihirli sis gönderilirse bunlar gönderilme sırasına göre etkili olur.","pm_mt_matchNewFaq_topic3_1_team_mist":"Ekip maçları sırasında gönderilen sihirli sisler, CANLI Yayın içerik üreticisinin ekip arkadaşlarına da uygulanır.","pm_mt_matchNewFaq_topic3_1_11":"Ek süre","pm_mt_matchNewFaq_topic3_1_12":"Ek süre, maç süresini 10 saniyeye kadar uzatabilir. Ek süre, CANLI Yayın içerik üreticilerinin CANLI Yayınlarını sonlandırmalarını veya maçtan çıkmalarını engelleyemez.","pm_mt_matchNewFaq_topic3_1_13":"Birden fazla gönderilen ek sürelerde gönderilme sırası geçerli olacaktır.","pm_mt_matchNewFaq_topic3_1_14":"Bir maç ek süre ile 3 defadan fazla uzatılamaz.","pm_mt_matchNewFaq_topic3_1_15":"Sersemletici çekiç","pm_mt_matchNewFaq_topic3_1_16":"Sersemletici çekiç devreye girdiğinde rakip içerik üreticisine veya ekibe çekiç etkisi uygulanır. Sersemletici çekiç, izleyicilerin 30 saniye içerisinde Hediye göndererek rakip içerik üreticisine veya ekibe çekiç etkileri uygulamalarına olanak sunar. 5 ya da daha fazla Jeton değerinde Hediyeler çekiç etkisi, 100 ya da daha fazla Jeton değerinde Hediyeler çekiç kombosu tetikler.","pm_mt_matchNewFaq_topic3_1_17":"Birden fazla sersemletici çekiç gönderilirse çekiçler, gönderilme sırasına göre etkili olur.","pm_mt_matchNewFaq_topic3_1_18":"Ekip maçları sırasında tetiklenen çekiç etkileri, CANLI Yayın içerik üreticisinin ekip arkadaşlarına da uygulanır.","pm_mt_matchNewFaq_topic3_1_19":"Özel hediyelerin olduğu maçlar sırasında özel Hediyenin 5 Jetondan ucuz olduğu durumlarda sersemletici çekiç kullanılamaz.","pm_mt_matchNewFaq_topic3_1_20":"Bireysel maçlar sırasında, tetiklenen çekiç efektleri 1 rakip içerik üreticisine rastgele olarak uygulanacaktır.","pm_mt_matchNewFaq_topic3_2":"2. Maç takviyelerini nasıl kullanabilirim?","pm_mt_matchNewFaq_topic3_2_1":"CANLI Yayın maçı sırasında, mevcut maç takviyelerinizi [Hediyeler] \u003E [Sırt Çantası] bölümünde bulabilir ve bir maç takviyesini seçerek gönderebilirsiniz.","pm_mt_matchNewFaq_topic3_2_2":"Göndermeden önce, seçtiğinizde bir maç takviyesinin nasıl işlev gösterdiğine göz atabilirsiniz.","pm_mt_matchNewFaq_topic3_3":"3. Maç takviyelerini nasıl alabilirim?","pm_mt_matchNewFaq_topic3_3_1_new":"Maç takviyeleri, kazanan CANLI Yayın içerik üreticisine en çok katkıda bulunan 3 izleyiciye dağıtılabilir (bu izleyicilerin hâlâ CANLI Yayını izliyor olmaları gerekir).","pm_mt_matchNewFaq_topic3_3_2":"CANLI Yayın içerik üreticisinin altındaki profil fotoğraflarına dokunarak Katkıda Bulunan Kullanıcı Sıralamasını kontrol edebilirsiniz.","pm_mt_matchNewFaq_topic3_4":"4. Maç takviyelerinin kullanımında sınırlamalar var mı?​","pm_mt_matchNewFaq_topic3_4_1":"Maç takviyelerinin süresi, [Sırt Çantanıza] yerleştirildikten 5 gün sonra dolar.","pm_mt_matchNewFaq_topic3_4_2":"Maç takviyeleri, yalnızca gelecekteki bir CANLI Yayın maçında, yaptığı CANLI Yayın sırasında karşılık gelen maç takviyesini aldığınız CANLI Yayın içerik üreticisini desteklemek için kullanılabilir.","pm_mt_matchNewFaq_topic3_4_3":"Maç takviyeleri mevcut değil ve zafer turları sırasında gönderilemez.​​","pm_mt_matchRedesign_faq_group4":"Hız meydan okuması","pm_mt_matchNewFaq_topic4_1":"1. Hızlı meydan okumalar nedir?","pm :"CANLI Yayın içeriğiniz, yaratıcılığa ilham veriyor ve TikTok CANLI Yayın'daki oyun topluluğunun eğlenmesini sağlıyor.","ttlive_gamingLiveProRecog_hostPanel_halfSheet_badgeDesc":"Gaming LIVE Pro rozetiniz, CANLI Yayın sırasında kullanıcı adınızın altında ve profil sayfanızda görünür.","ttlive_gamingLiveProRecog_hostPanel_halfSheet_loseDesc":"CANLI Yayın içeriğiniz, Topluluk Kurallarını ihlal ediyorsa veya gerekliliklerimizi karşılamıyorsa Gaming LIVE Pro rozetinizi kaybedersiniz. [Daha fazla bilgi].","ttlive_gamingLiveProRecog_viewerPanel_title":"Gaming LIVE Pro nedir?","ttlive_gamingLiveProRecog_viewerPanel_desc":"Gaming LIVE Pro içerik üreticileri, yaratıcılığa ilham verir ve TikTok oyun CANLI Yayını topluluğunun eğlenmesini sağlar. Ayrıca, diğer oyun CANLI Yayını içerik üreticileri için standardı belirlerler.","pm_mt_LIVEProSharing_LIVEviwerPage_LIVEProPanel_suggestedCreatorLabel":"Önerilen içerik üreticileri","inbox":"Gelen kutusu","following":"Takipte","about":"Hakkında","TikTok":"TikTok","pm_mt_GamingLIVEProBadge_faq_questionIntro":"1. Gaming LIVE Pro rozeti nedir?","pm_mt_GamingLIVEProBadge_faq_questionIntroAnswer_1":"Gaming LIVE Pro rozeti, ilgi çekici oyun CANLI Yayını içerikleri üreten ve TikTok CANLI Yayın'ın oyun topluluğuna katkıda bulunan özverili ve popüler CANLI Yayın içerik üreticilerine verilir. Gaming LIVE Pro ünvanı verilen CANLI Yayın içerik üreticileri, CANLI Yayın sırasında kullanıcı adlarının altında ve profil sayfalarında görünecek bir rozet kazanırlar.","pm_mt_GamingLIVEProBadge_faq_questionIntroAnswer_2":"Gaming LIVE Pro rozeti artık şu ülkelerde mevcut: ABD, Almanya, Japonya, Endonezya, Malezya ve Türkiye. Gelecekte kullanıma sunulacağı daha fazla ülke ve bölge için takipte kalın.","pm_mt_GamingLIVEProBadge_faq_questionEligibility":"2. Kimler Gaming LIVE Pro rozeti alabilir?","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_1":"TikTok; özgün, farklı ve samimi bir topluluk deneyimi oluşturmayı amaçlar.","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_2":"CANLI Yayın içerik üreticilerinin, yüksek kaliteli oyun CANLI Yayını içerikleri üretebildiklerini ve olumlu bir oyun CANLI Yayın topluluğu oluşturabildiklerini göstermeleri gerekir.","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_3":"Bunlar aşağıdakileri karşılayan seçkin içerik üreticileridir:","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_4":"Son 14 gün içindeki CANLI Yayınlarının en az %50'si oyun veya oyun deneyimi ile ilgili olarak CANLI Yayın yapmak;","ttlive_GamingLIVEProBadge_faq_questionEligibilityAnswer_5":"{num, plural, one {Son 30 gün içinde en az {s_num} Elmas toplamış olmak veya {s_requirement};} other {Son 30 gün içinde en az {s_num} Elmas toplamış olmak veya {s_requirement};}}","ttlive_GamingLIVEProBadge_faq_questionEligibilityAnswer_5_1":"{num, plural, one {Hayran Kulübünde {s_num} Süper Hayran bulunması} other {Hayran Kulübünde {s_num} Süper Hayran bulunması}}","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_6":"Son 30 günde ortalama olarak en az 100 eş zamanlı izleyiciye sahip olmak;","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_7":"Platformdaki [kimliklerini doğrulayın].","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_8":"Yukarıda belirtilenler yalnızca minimum gerekliliklerdir ve içerik üreticilerinin CANLI Yayın içerikleri ile TikTok oyun CANLI Yayın topluluğuna katkıları dikkatli bir şekilde göz önünde bulundurulur.","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_9":"Nihai onay, yalnızca TikTok'un takdirine bağlı olarak verilir.","pm_mt_GamingLIVEProBadge_faq_questionEligibilityAnswer_10":"Hükûmet, Siyasetçi, Siyasi Parti, İşletme ve Kurum hesapları uygun değildir.","pm_mt_GamingLIVEProBadge_faq_questionRemoval":"3. Gaming LIVE Pro rozeti kalıcı mı?","pm_mt_GamingLIVEProBadge_faq_questionRemovalAnswer_1":"CANLI Yayın içerik üreticisi uygunluğunu kaybederse Gaming LIVE Pro rozeti kaybolur.","pm_mt_GamingLIVEProBadge_faq_questionRemovalAnswer_2":"Bu, şu durumlarda olabilir:","pm_mt_GamingLIVEProBadge_faq_questionRemovalAnswer_3":"CANLI Yayın içerik üreticisi [Topluluk Kurallarımızı], [Hizmet Şartlarımızı] veya geçerli olabilecek herhangi bir koşulu veya politikayı ihlal ediyor.","pm_mt_GamingLIVEProBadge_faq_questionRemovalAnswer_4":"CANLI Yayın içerik üreticisi, üst üste iki (2) ay boyunca yukarıdaki 2. soruda belirtilen minimum gereklilikleri karşılamıyor.","pm_mt_GamingLIVEProBadge_faq_questionRemovalAnswer_5":"Gaming LIVE Pro rozetinin herhangi bir zamanda kaldırılabileceğini lütfen unutmayın.","pm_mt_GamingLIVEProBadge_faq_questionLIVEProDiff":"4. LIVE Pro rozeti ve Gaming LIVE Pro rozeti arasındaki fark nedir?","pm_mt_GamingLIVEProBadge_faq_questionLIVEProDiffAnswer_1":"LIVE Pro rozeti tüm uygun CANLI Yayın içerik üreticileri içindir; Gaming LIVE Pro rozeti ise yalnızca uygun oyun CANLI Yayını içerik üreticileri içindir.","pm_mt_GamingLIVEProBadge_faq_questionLIVEProDiffAnswer_2":"Bir içerik üreticisinin, Elmas ve aktif abone sayısıyla ilgili gereklilikleri karşılamanın yanı sıra; LIVE Pro olarak tanınmak için ortalama eş zamanlı izleyici veya takipçi sayısındaki minimum gereksinimi de karşılaması gerekir, Gaming LIVE Pro olarak tanınması için ise yalnızca ortalama eş zamanlı izleyici sayısındaki minimum gereksinimi karşılaması gerekir. Nihai onay yalnızca TikTok'un takdirine bağlı olarak verilir. [LIVE Pro] hakkında daha fazla bilgi edinin","pm_mt_GamingLIVEProBadge_faq_disclaimer":"* Gaming LIVE Pro rozeti almış bir içerik üreticisinin tüm içerikleri, ifade özgürlüğü hakkı kullanılarak oluşturulmaktadır ve içerik üreticilerinin Platformda kullanıma sundukları içeriklerin sorumluluğu kendilerine aittir.","pm_mt_LIVEProBadge_faq_questionIntro_EUVer":"1. LIVE Pro rozeti nedir?","pm_mt_LIVEProBadge_faq_questionIntroAnswer_EUVer":"LIVE Pro rozeti, sürekli olarak ilgi çekici içerikler üreten ve TikTok CANLI Yayın topluluğuna katkıda bulunan özverili ve popüler içerik üreticilerine verilen bir rozettir. LIVE Pro içerik ve yaratıcı düzenleme içermeyen ve başka kaynaklardan (başka platformlar, TV programları, filmler ya da web yayınları gibi) içe aktarılan veya yüklenen videolar bulunur. Üzerinde filigran ya da üste yerleştirilmiş bir logo bulunduran videoların orijinal olmadığını anlarız. Düşük kaliteli içerikler arasında çok kısa videolar, sabit resimler ve sadece GIF'lerle hazırlanan videolar bulunur. Kullanıcıları zararlı web siteleri ya da uygulamalara yönlendirebileceğinden genelde QR kodlu içerikler Sizin İçin akışına uygun değildir. Öte yandan, riskin düşük olduğu durumlarda (örneğin, e-ticaret için) istisnalar yapabiliriz.","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_title":"Özgün olmayan, düşük kaliteli ve QR kodlu içerikler","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_desc":"Kullanıcılarımızın TikTok platformundan beklediği pozitif deneyimi korumak adına orijinal olmayan ve düşük kaliteli içerikler tavsiye için uygun değildir. Orijinal olmayan içerik, yeni ve yaratıcı düzenlemelerin olmadığı, doğrudan başka kaynaklardan aktarılan ya da kopyalanan içeriktir. Filigran ya da logo barındıran bir video orijinal olmayabilir. Düşük kaliteli içerikler arasında çok kısa videolar, sabit resimler ve yalnızca GIF'lerden yapılmış videolar bulunur.","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_title":"Kopyalanmış hesap","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_desc":"Hesabınız, özgün olmayan ve Sizin İçin akışına uygun bulunmayan gönderiler içeriyor. Daha fazla bilgi için Topluluk Kuralları \u003E Sizin İçin akışında izin verilmeyen içerikler \u003E Özgün olmayan, düşük kaliteli ve QR kodlu içerikler bölümünü inceleyin","vid_mod_analytics_penalty_reason_spam_title":"Spam, özgün olmayan veya yanıltıcı içerik","vid_mod_analytics_penalty_reason_spam_desc":"Platformda daha fazla takipçi, beğeni, görüntüleme veya diğer etkileşim metrikleri almak için kullanıcıları kandırmaya ya da manipüle etmeye çalışan içerikler Sizin İçin akışına uygun değildir. Bunlara, kullanıcıları birbirlerini takip etmeye ya da beğenmeye yönlendiren veya kullanıcıları beğenme veya paylaşma düğmelerine tıklamaları için kandıran içerikler dâhildir. Ek olarak, komplo teorilerini teşvik eden ve güncel olaylar ve hâlâ gelişmekte olan olaylar hakkında yanlış veya zararlı bilgiler yayan içerikler de Sizin İçin akışına uygun değildir.","vid_mod_analytics_penalty_reason_sexual_title":"Açıkça müstehcen içerikler","vid_mod_analytics_penalty_reason_sexual_desc":"Cinsel açıdan aşırı davetkar içerikler, konforlu bir deneyim sağlamak adına öneriler için uygun olmayabilir. Çıplaklık imasında bulunan, beden uzuvlarını cinselleştiren ya da bariz biçimde erotik ya da müstehcen içerikler (yani striptiz) buna dâhildir.","vid_mod_analytics_penalty_reason_tobacco_title":"Tütün ve alkol ürünleri","vid_mod_analytics_penalty_reason_tobacco_desc":"Yasal alkol tüketme yaşındaki kişilerin alkollü ürünleri tehlikeli bir şekilde tanıttığı, anlattığı ya da tasvir ettiği içerikler öneri için uygun olmayabilir. Yetişkinlerin tütün ürünü kullanımını tasvir eden ya da kontrollü maddelerden bahseden içerikler öneri için uygun olmayabilir.","vid_mod_analytics_penalty_reason_stunts_title":"Tehlikeli hareketler ve sporlar","vid_mod_analytics_penalty_reason_stunts_desc":"Güvenlik uyarıları olmadan tekrar edilen belli faaliyetler riskli veya tehlikeli olup fiziksel hasara yol açabilir. Profesyonel olmayan kişilerin gerçekleştirdiği tehlikeli numaralar ya da ekstrem sporlar uygun olmayabilir.","vid_mod_analytics_penalty_reason_graphic_title":"Şiddet içeren görüntü","vid_mod_analytics_penalty_reason_graphic_desc":"Korkutucu efektler, ani korkutmalar, kanlı yaraları gerçekçi şekilde taklit eden makyaj ve vücut işlevlerinin tasvirleri gibi izleyicilerde rahatsızlığa, şoka ya da iğrenmeye neden olan içerikler Sizin İçin akışına uygun olmayabilir. Şiddet ve müstehcenlik içeren çoğu içeriğe TikTok'ta izin verilmez. Ancak gerçek dünyadaki olayların belgelenmesi niteliğinde ve kamu yararına
