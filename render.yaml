# Render.com — tek tıkla arka uç kurulumu
# Arayüz GitHub Pages'te, WebSocket sunucusu burada çalışır.
services:
  - type: web
    name: tiktok-radar-api
    runtime: node
    plan: free
    rootDir: Tiktok
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      # Panelin bağlanacağı origin'i kısıtlamak isterseniz ileride buraya
      # PANEL_ORIGIN eklenebilir (şu an sunucu origin kontrolü yapmıyor).
