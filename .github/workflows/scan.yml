name: 📡 Canlı Tarayıcı

# Havuzdaki adresleri tarar, canlı olanlara bağlanır, jeton olaylarını toplar.
# Sonucu site/firsat/data/live.json'a yazar; Pages paneli onu okur.

on:
  schedule:
    # 24 saate yakın kesintisiz tarama: her 4 saatte bir 230 dk.
    # (GitHub tek işi en fazla 6 saat çalıştırır; 4 saatlik tur + kısa boşluk.)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: 📦 Bağımlılıklar
        run: npm ci --prefix scanner --no-audit --no-fund

      - name: ⚙️ Git kimliği
        run: |
          git config user.name "canli-tarayici"
          git config user.email "actions@users.noreply.github.com"

      - name: 🔍 Tara ve dinle
        # Uç 10 kanallık bir anlık görüntü veriyor ve dakikalar içinde komple
        # değişiyor: 60 sn'de bir sormak, 2 dakikada bir sormaktan iki kat yeni
        # yayıncı demek (tüm ülkelerden, sıralamada olmasa da canlı olanlar).
        run: node scanner/index.js --minutes=230 --commit=300 --watch=1 --watch-rooms=32 --watch-sec=600 --connect-gap=4000 --min-rooms=8 --discover-sec=60 --max-pool=6000 --concurrency=12 --poll=120
