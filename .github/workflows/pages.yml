name: 🎛️ Panel (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Paneli hazırla
        run: |
          mkdir -p _site/firsat
          cp site/index.html site/main.js site/styles.css site/config.js site/web-shim.js site/hunt.js site/store-client.js _site/
          cp site/firsat/index.html site/firsat/app.js site/firsat/store.js site/firsat/styles.css _site/firsat/
          echo "Panel dosyaları:"
          ls -la _site _site/firsat

      - name: ⚙️ Pages ayarları
        uses: actions/configure-pages@v5

      - name: ⬆️ Artefakt yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
